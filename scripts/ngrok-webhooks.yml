# ngrok traffic policy for development: expose only webhook endpoints of the
# central plane, never the console or the API.
#   ngrok http 8090 --traffic-policy-file scripts/ngrok-webhooks.yml
on_http_request:
  - expressions:
      - "!req.url.path.startsWith('/webhooks/')"
    actions:
      - type: custom-response
        config:
          status_code: 404
          body: "not found"
