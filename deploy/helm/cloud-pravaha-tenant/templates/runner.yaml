{{- if .Values.runner.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-runner
  labels: {{- include "tenant.labels" . | nindent 4 }}
  annotations: {{- toYaml .Values.runner.serviceAccountAnnotations | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-runner
  labels: {{- include "tenant.labels" . | nindent 4 }}
    app.kubernetes.io/name: cloud-pravaha-runner
spec:
  replicas: {{ .Values.runner.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: cloud-pravaha-runner, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloud-pravaha-runner
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- with .Values.runner.podLabels }}{{ toYaml . | nindent 8 }}{{ end }}
    spec:
      serviceAccountName: {{ .Release.Name }}-runner
      securityContext: { runAsNonRoot: true, fsGroup: 65532, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: runner
          image: "{{ .Values.image.runner }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["runner"]
          env:
            - { name: PRAVAHA_SERVER_URL, value: "https://{{ include "tenant.name" . }}" }
            - { name: PRAVAHA_RUNNER_TOKEN_FILE, value: /secrets/runner-token }
            - { name: PRAVAHA_STATE_KEY_FILE, value: /secrets/state-key }
            - { name: PRAVAHA_RUNNER_CONCURRENCY, value: {{ .Values.runner.concurrency | quote }} }
            - { name: PRAVAHA_CA_FILE, value: /tls/ca.crt }
            - { name: PRAVAHA_RUNNER_NAME, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: PRAVAHA_BUNDLE_CACHE_DIR, value: /tmp/bundles } # module release bundles, kept between runs
            - { name: PRAVAHA_BUNDLE_CACHE_DISK_MB, value: {{ .Values.runner.bundleCacheMB | quote }} }
          securityContext: {{- include "pravaha.securityContext" . | nindent 12 }}
          resources: {{- toYaml .Values.runner.resources | nindent 12 }}
          volumeMounts:
            - { name: secrets, mountPath: /secrets, readOnly: true }
            - { name: tls, mountPath: /tls, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: secrets
          secret: { secretName: {{ .Values.runner.existingSecret }}, defaultMode: 0400 }
        - name: tls
          secret: { secretName: {{ .Values.tls.secretName }}, items: [{ key: ca.crt, path: ca.crt }] }
        # Per-run working directories; providers execute from here.
        - name: tmp
          emptyDir: { sizeLimit: {{ .Values.runner.tmpSize }} }
{{- end }}
