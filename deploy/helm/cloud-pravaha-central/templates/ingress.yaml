{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "central.name" . }}
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
    {{- with .Values.ingress.annotations }}{{ toYaml . | nindent 4 }}{{ end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  tls: [{ hosts: [{{ .Values.ingress.host | quote }}], secretName: {{ .Values.tls.secretName }} }]
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: {{ include "central.name" . }}, port: { name: https } } }
{{- end }}
