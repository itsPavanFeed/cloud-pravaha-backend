apiVersion: v1
kind: Service
metadata:
  name: {{ include "central.name" . }}
  labels: {{- include "central.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "central.selector" . | nindent 4 }}
  ports:
    - { name: https, port: {{ .Values.service.port }}, targetPort: https }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "central.name" . }}
spec:
  minAvailable: 1
  selector:
    matchLabels: {{- include "central.selector" . | nindent 6 }}
