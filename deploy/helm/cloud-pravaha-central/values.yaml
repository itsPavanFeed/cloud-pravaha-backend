image:
  repository: ghcr.io/itspavanfeed/cloud-pravaha-server
  tag: "0.1.0"
  pullPolicy: IfNotPresent

replicas: 2

# URL users reach the central plane at; also the issuer of tenant assertions.
publicURL: https://pravaha.example.com

# Existing Secret with keys: database-url, master-key (32 random bytes, base64).
# Optional keys: oidc-client-secret.
existingSecret: cloud-pravaha-central

tls:
  # Secret (kubernetes.io/tls) with the server certificate. Created by cert-manager when enabled.
  secretName: cloud-pravaha-central-tls
  # Secret with central's mTLS client certificate (tls.crt, tls.key), presented to tenant planes.
  clientSecretName: cloud-pravaha-central-client
  certManager:
    enabled: false
    issuerRef: { kind: ClusterIssuer, name: cloud-pravaha-ca }
    dnsNames: [pravaha.example.com]

sso:
  issuer: ""          # e.g. https://acme.okta.com
  clientID: ""
  allowedDomains: ""  # e.g. acme.com
  trustUnverifiedEmail: false
  label: Sign in with SSO

service:
  type: ClusterIP
  port: 443

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: pravaha.example.com

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { memory: 512Mi }

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
